<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>카페24 인증 완료</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fa; color: #172b4d; }
    main { width: min(600px, calc(100% - 48px)); padding: 40px; border: 1px solid #d8e0eb; border-radius: 16px; background: white; box-shadow: 0 12px 32px #17345b14; }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; margin-bottom: 20px; border-radius: 50%; background: #e4f7ec; color: #147a43; font-size: 28px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 8px 0 0; color: #52637a; line-height: 1.7; }
    strong { color: #172b4d; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>카페24 인증 요청이 완료되었습니다</h1>
    <p><strong>브라우저 주소창의 전체 URL</strong>을 복사해 로컬 CLI 터미널에 붙여넣으세요.</p>
    <p>주소에는 일회용 인증 정보가 포함되어 있으므로 다른 사람에게 전달하지 마세요.</p>
  </main>
</body>
</html>
