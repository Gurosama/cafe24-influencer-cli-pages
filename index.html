<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>카페24 인플루언서 할인코드 CLI</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fa; color: #172b4d; }
    main { width: min(560px, calc(100% - 48px)); padding: 40px; border: 1px solid #d8e0eb; border-radius: 16px; background: white; box-shadow: 0 12px 32px #17345b14; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #52637a; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>카페24 인플루언서 할인코드 CLI</h1>
    <p>카페24 OAuth 인증을 위한 안내 페이지입니다.</p>
  </main>

</html>
